<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaLab - STEM Interactive Class</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <style>
    :root { --primary: #0f766e; --primary-dark: #115e59; --bg: #f0fdf4; --card: #ffffff; --text: #1e293b; }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
    header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    header h1 { margin: 0; font-size: 1.15rem; }
    header span { font-size: 0.78rem; opacity: 0.92; display: block; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .lang-switch { background: #ffffff; color: var(--primary); border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    .profile-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35); color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }

    /* ಮೊದಲ ಬಾರಿಯ ಸ್ವಾಗತ ಪರದೆ (One-Time Welcome Gate) */
    #welcome-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; padding: 16px; z-index: 200; }
    .welcome-card { background: #fff; padding: 22px; border-radius: 18px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); animation: popIn 0.25s ease; }
    @keyframes popIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .welcome-card h2 { margin: 0 0 6px; color: var(--primary); font-size: 1.2rem; }
    .welcome-card p { margin: 0 0 14px; font-size: 0.88rem; color: #475569; line-height: 1.4; }
    .welcome-card input { width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; }
    .role-group { display: flex; gap: 8px; margin-bottom: 14px; }
    .role-opt { flex: 1; text-align: center; padding: 9px 6px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; background: #f8fafc; transition: 0.2s; }
    .role-opt.active { background: #ccfbf1; border-color: var(--primary); color: var(--primary-dark); }
    .welcome-btns { display: flex; gap: 10px; }
    .btn-skip { flex: 1; background: #e2e8f0; color: #334155; border: none; padding: 11px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.92rem; }
    .btn-start { flex: 2; background: var(--primary); color: #fff; border: none; padding: 11px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }

    #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 12px 15px; border-radius: 16px; font-size: 0.96rem; line-height: 1.5; }
    .bot { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { background: #ccfbf1; color: #0f766e; border: 1px solid #99f6e4; padding: 7px 13px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .chip:hover { background: #99f6e4; }
    .act-card { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px; margin-top: 9px; }
    .act-title { font-weight: 700; font-size: 1rem; color: #0f172a; margin-bottom: 4px; }
    .act-meta { font-size: 0.8rem; color: #475569; margin-bottom: 9px; }
    .badge-new { background: #dc2626; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .open-btn { background: var(--primary); color: #fff; text-decoration: none; padding: 7px 13px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; display: inline-block; }
    .fb-btn { background: #e2e8f0; color: #1e293b; border: none; padding: 7px 11px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
    .input-area { background: #fff; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #e2e8f0; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 24px; font-size: 0.95rem; outline: none; }
    .input-area button { background: var(--primary); color: #fff; border: none; padding: 0 18px; border-radius: 24px; font-weight: 600; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-content { background: #fff; padding: 18px; border-radius: 14px; width: 100%; max-width: 380px; }
    .modal-content h3 { margin-top: 0; color: var(--primary); }
    .modal-content select, .modal-content textarea { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>

<!-- ಮೊದಲ ಬಾರಿಯ ಸ್ವಾಗತ ಫಾರ್ಮ್ (One-Time Only) -->
<div id="welcome-overlay">
  <div class="welcome-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h2 id="w-title">🔬 STEM ತರಗತಿಗೆ ಸುಸ್ವಾಗತ!</h2>
      <button class="lang-switch" style="background:#ccfbf1;" onclick="toggleWelcomeLang()" id="w-lang-btn">English</button>
    </div>
    <p id="w-desc">ಪ್ರಯೋಗಗಳನ್ನು ಪ್ರಾರಂಭಿಸುವ ಮುನ್ನ ನಿಮ್ಮ ಚಿಕ್ಕ ಪರಿಚಯ ನೀಡಿ (ಅಥವಾ Skip ಒತ್ತಿ ಮುಂದುವರಿಯಿರಿ):</p>
    
    <input type="text" id="w-name" placeholder="ನಿಮ್ಮ ಹೆಸರು / Your Name" />
    <input type="text" id="w-place" placeholder="ಊರು ಅಥವಾ ಶಾಲೆ / Place or School" />
    
    <div style="font-size:0.82rem; font-weight:600; margin-bottom:6px; color:#334155;" id="w-role-label">ನೀವು ಯಾರು? / Select Role:</div>
    <div class="role-group">
      <div class="role-opt active" data-role="Teacher" onclick="selectRole(this)">👩‍🏫 ಶಿಕ್ಷಕರು<br><small>Teacher</small></div>
      <div class="role-opt" data-role="Student" onclick="selectRole(this)">🎓 ವಿದ್ಯಾರ್ಥಿ<br><small>Student</small></div>
      <div class="role-opt" data-role="Other" onclick="selectRole(this)">🌟 ಇತರರು<br><small>Other</small></div>
    </div>

    <div class="welcome-btns">
      <button class="btn-skip" onclick="skipWelcome()" id="w-skip-btn">Skip ಮಾಡಿ →</button>
      <button class="btn-start" onclick="submitWelcome()" id="w-start-btn">ಪ್ರಾರಂಭಿಸಿ 🚀</button>
    </div>
  </div>
</div>

<header>
  <div>
    <h1>🔬 InstaLab STEM</h1>
    <span id="header-sub">ಸಂವಾದಾತ್ಮಕ ವಿಜ್ಞಾನ ತರಗತಿ</span>
  </div>
  <div class="header-actions">
    <button class="lang-switch" id="lang-btn" onclick="toggleLanguage()">English</button>
    <button class="profile-btn" id="prof-btn" onclick="reopenWelcome()">👤 ವಿವರ</button>
  </div>
</header>

<div id="chat-box"></div>

<div class="input-area">
  <input type="text" id="user-input" placeholder="ತರಗತಿ (7) ಅಥವಾ ವಿಷಯ (ಶಾಖ / Heat) ಹುಡುಕಿ..." onkeypress="if(event.key==='Enter') handleSearch()" />
  <button id="send-btn" onclick="handleSearch()">ಹುಡುಕಿ</button>
</div>

<!-- ಫೀಡ್‌ಬ್ಯಾಕ್ Modal -->
<div id="fb-modal" class="modal">
  <div class="modal-content">
    <h3 id="fb-act-title">ಅಭಿಪ್ರಾಯ ತಿಳಿಸಿ / Feedback</h3>
    <select id="fb-rating">
      <option value="5 ⭐">⭐⭐⭐⭐⭐ (ಅತ್ಯುತ್ತಮ / Excellent)</option>
      <option value="4 ⭐">⭐⭐⭐⭐ (ಉತ್ತಮ / Good)</option>
      <option value="3 ⭐">⭐⭐⭐ (ಸಾಧಾರಣ / Average)</option>
      <option value="2 ⭐">⭐⭐ (ಸುಧಾರಣೆ ಬೇಕು / Needs Improvement)</option>
    </select>
    <textarea id="fb-text" rows="3" placeholder="ನಿಮ್ಮ ಅನಿಸಿಕೆ ಬರೆಯಿರಿ / Share your experience..."></textarea>
    <div class="modal-actions">
      <button class="fb-btn" onclick="closeModal('fb-modal')">ರದ್ದು / Cancel</button>
      <button class="open-btn" style="border:none" onclick="submitFeedback()">ಸಲ್ಲಿಸಿ / Submit</button>
    </div>
  </div>
</div>

<script>
  // ✅ ನಿಮ್ಮ Google Sheet CSV ಲಿಂಕ್ (ಈಗಾಗಲೇ ಜೋಡಿಸಲಾಗಿದೆ)
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTqNXV7gbEOJqNo8GghJ1snWWcgPcfE7849U6LAonFPQhbqsRpDqsfO3TIffLLCN9QvjeSI4KGfh-YP/pub?gid=0&single=true&output=csv";

  // ✅ ನಿಮ್ಮ Google Form URL ಮತ್ತು Entry ID ಗಳು (ಈಗಾಗಲೇ ಜೋಡಿಸಲಾಗಿದೆ)
  const FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeZeQdiFHAblUX-xDjV5t04Z09SZ1fSJzAVU9uIgKXAx-0chw/formResponse";
  const ENTRY_IDS = {
    action: "entry.1710279365",   // 1: Action
    name: "entry.407771457",      // 2: Name
    place: "entry.709255333",     // 3: Place
    role: "entry.405156714",      // 4: Role
    activity: "entry.803362932",  // 5: Activity
    feedback: "entry.1264840980"  // 6: Feedback
  };

  let currentLang = "kn";
  let selectedRole = "Teacher";
  let allActivities = [];
  let fuse;
  let selectedActivity = "";

  const UI_TEXT = {
    kn: {
      sub: "ಸಂವಾದಾತ್ಮಕ ವಿಜ್ಞಾನ ತರಗತಿ",
      langBtn: "English",
      profBtn: "👤 ವಿವರ",
      placeholder: "ತರಗತಿ (7) ಅಥವಾ ವಿಷಯ (ಶಾಖ / Heat) ಹುಡುಕಿ...",
      sendBtn: "ಹುಡುಕಿ",
      c6: "6ನೇ ತರಗತಿ",
      c7: "7ನೇ ತರಗತಿ",
      c8: "8ನೇ ತರಗತಿ",
      all: (n) => `ಎಲ್ಲಾ ಪ್ರಯೋಗಗಳು (${n})`,
      openBtn: "ಪ್ರಯೋಗ ತೆರೆಯಿರಿ →",
      fbBtn: "⭐ ಅಭಿಪ್ರಾಯ",
      newBadge: "ಹೊಸದು",
      classLabel: "ತರಗತಿ",
      subLabel: "ವಿಷಯ",
      notFound: (q) => `ಕ್ಷಮಿಸಿ, "${q}" ಗೆ ಸಂಬಂಧಿಸಿದ ಪ್ರಯೋಗ ಸಿಗಲಿಲ್ಲ. ಕೆಳಗಿನ ತರಗತಿಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ನೋಡಿ:`,
      foundHeading: (q) => `"${q}" ಹುಡುಕಾಟಕ್ಕೆ ಸಿಕ್ಕ ಪ್ರಯೋಗಗಳು:`,
      classHeading: (c) => `${c}ನೇ ತರಗತಿಗೆ ಲಭ್ಯವಿರುವ ಪ್ರಯೋಗಗಳು:`,
      allHeading: "ಲಭ್ಯವಿರುವ ಎಲ್ಲಾ STEM ಪ್ರಯೋಗಗಳು:"
    },
    en: {
      sub: "Interactive Science Class",
      langBtn: "ಕನ್ನಡ",
      profBtn: "👤 Profile",
      placeholder: "Search grade (7) or topic (Heat / Solar)...",
      sendBtn: "Search",
      c6: "Grade 6",
      c7: "Grade 7",
      c8: "Grade 8",
      all: (n) => `All Experiments (${n})`,
      openBtn: "Launch Lab →",
      fbBtn: "⭐ Feedback",
      newBadge: "NEW",
      classLabel: "Grade",
      subLabel: "Subject",
      notFound: (q) => `Sorry, no experiment matched "${q}". Try selecting a grade below:`,
      foundHeading: (q) => `Experiments found for "${q}":`,
      classHeading: (c) => `Interactive Labs for Grade ${c}:`,
      allHeading: "All Available STEM Experiments:"
    }
  };

  window.onload = () => {
    if (!localStorage.getItem("instalab_visited")) {
      // ಮೊದಲ ಬಾರಿ ಬಂದವರಿಗೆ ಮಾತ್ರ ಫಾರ್ಮ್ ತೋರಿಸುವುದು
      document.getElementById("welcome-overlay").style.display = "flex";
    } else {
      // ಎರಡನೇ ಬಾರಿ ಮತ್ತು ನಂತರ ಬಂದವರಿಗೆ ಫಾರ್ಮ್ ಕೇಳದೆ ನೇರವಾಗಿ Auto-Track ಮಾಡುವುದು
      sendToGoogleForm("Returning_Visit", "App_Opened", "Auto-Tracked");
    }
    loadActivities();
  };

  function selectRole(el) {
    document.querySelectorAll(".role-opt").forEach(item => item.classList.remove("active"));
    el.classList.add("active");
    selectedRole = el.getAttribute("data-role");
  }

  function toggleWelcomeLang() {
    toggleLanguage();
    const isKn = currentLang === "kn";
    document.getElementById("w-lang-btn").textContent = isKn ? "English" : "ಕನ್ನಡ";
    document.getElementById("w-title").textContent = isKn ? "🔬 STEM ತರಗತಿಗೆ ಸುಸ್ವಾಗತ!" : "🔬 Welcome to STEM Class!";
    document.getElementById("w-desc").textContent = isKn
      ? "ಪ್ರಯೋಗಗಳನ್ನು ಪ್ರಾರಂಭಿಸುವ ಮುನ್ನ ನಿಮ್ಮ ಚಿಕ್ಕ ಪರಿಚಯ ನೀಡಿ (ಅಥವಾ Skip ಒತ್ತಿ ಮುಂದುವರಿಯಿರಿ):"
      : "Introduce yourself before exploring interactive labs (or tap Skip to continue):";
    document.getElementById("w-skip-btn").textContent = isKn ? "Skip ಮಾಡಿ →" : "Skip →";
    document.getElementById("w-start-btn").textContent = isKn ? "ಪ್ರಾರಂಭಿಸಿ 🚀" : "Start Exploring 🚀";
  }

  function submitWelcome() {
    const name = document.getElementById("w-name").value.trim() || "Anonymous";
    const place = document.getElementById("w-place").value.trim() || "Anonymous";
    const role = selectedRole || "Anonymous";

    localStorage.setItem("instalab_visited", "true");
    localStorage.setItem("u_name", name);
    localStorage.setItem("u_place", place);
    localStorage.setItem("u_role", role);

    document.getElementById("welcome-overlay").style.display = "none";
    sendToGoogleForm("Registered_User", "Welcome_Screen", `Joined as ${role}`);

    document.getElementById("chat-box").innerHTML = "";
    showWelcome();
  }

  function skipWelcome() {
    localStorage.setItem("instalab_visited", "true");
    localStorage.setItem("u_name", "Anonymous");
    localStorage.setItem("u_place", "Anonymous");
    localStorage.setItem("u_role", "Anonymous");

    document.getElementById("welcome-overlay").style.display = "none";
    sendToGoogleForm("Skipped_User", "Welcome_Screen", "Skipped as Anonymous");
  }

  function reopenWelcome() {
    const savedName = localStorage.getItem("u_name");
    const savedPlace = localStorage.getItem("u_place");
    document.getElementById("w-name").value = (savedName && savedName !== "Anonymous") ? savedName : "";
    document.getElementById("w-place").value = (savedPlace && savedPlace !== "Anonymous") ? savedPlace : "";
    document.getElementById("welcome-overlay").style.display = "flex";
  }

  function getTimeGreeting(lang) {
    const hr = new Date().getHours();
    if (lang === "kn") {
      if (hr < 12) return "ಶುಭೋದಯ! ☀️";
      if (hr < 17) return "ಶುಭ ಮಧ್ಯಾಹ್ನ! 🌤️";
      return "ಶುಭ ಸಂಜೆ! 🌆";
    } else {
      if (hr < 12) return "Good Morning! ☀️";
      if (hr < 17) return "Good Afternoon! 🌤️";
      return "Good Evening! 🌆";
    }
  }

  function toggleLanguage() {
    currentLang = currentLang === "kn" ? "en" : "kn";
    const t = UI_TEXT[currentLang];
    document.getElementById("header-sub").textContent = t.sub;
    document.getElementById("lang-btn").textContent = t.langBtn;
    document.getElementById("prof-btn").textContent = t.profBtn;
    document.getElementById("user-input").placeholder = t.placeholder;
    document.getElementById("send-btn").textContent = t.sendBtn;
    document.getElementById("chat-box").innerHTML = "";
    showWelcome();
  }

  function loadActivities() {
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (res) => {
        allActivities = res.data.filter(r => r.Activity && r.Link);
        initFuse();
        showWelcome();
      },
      error: () => {
        addBotMessage("❌ Google Sheet ನಿಂದ ಮಾಹಿತಿ ಪಡೆಯಲು ಸಾಧ್ಯವಾಗುತ್ತಿಲ್ಲ. ದಯವಿಟ್ಟು ಇಂಟರ್ನೆಟ್ ಸಂಪರ್ಕ ಪರಿಶೀಲಿಸಿ.");
      }
    });
  }

  function initFuse() {
    fuse = new Fuse(allActivities, {
      keys: ['Activity', 'Class', 'Subject', 'Keywords'],
      threshold: 0.4
    });
  }

  function showWelcome() {
    const savedName = localStorage.getItem("u_name");
    const greet = getTimeGreeting(currentLang);
    const namePart = (savedName && savedName !== "Anonymous")
      ? (currentLang === "kn" ? ` **${savedName}** ಅವರೇ,` : ` **${savedName}**,`)
      : "";

    if (currentLang === "kn") {
      addBotMessage(
        `${greet}${namePart}<br>✨ **STEM ಸಂವಾದಾತ್ಮಕ ತರಗತಿಗೆ (Interactive Class) ಸುಸ್ವಾಗತ!** 🚀<br>ವಿಜ್ಞಾನದ ವಿಸ್ಮಯಗಳನ್ನು ಪ್ರಯೋಗಗಳ ಮೂಲಕ ಕಲಿಯೋಣ. ಇಂದು ನಾನು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ? ಕೆಳಗಿನ ತರಗತಿ ಆಯ್ಕೆ ಮಾಡಿ ಅಥವಾ ವಿಷಯವನ್ನು ಟೈಪ್ ಮಾಡಿ:`,
        true
      );
    } else {
      addBotMessage(
        `${greet}${namePart}<br>✨ **Welcome to STEM Interactive Class!** 🚀<br>Explore science through hands-on digital labs. How can I help you today? Pick a grade below or type any science topic:`,
        true
      );
    }
  }

  function addBotMessage(htmlText, showChips = false) {
    const t = UI_TEXT[currentLang];
    const box = document.getElementById("chat-box");
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = htmlText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    if (showChips) {
      div.innerHTML += `
        <div class="chips">
          <button class="chip" onclick="filterByClass('6')">${t.c6}</button>
          <button class="chip" onclick="filterByClass('7')">${t.c7}</button>
          <button class="chip" onclick="filterByClass('8')">${t.c8}</button>
          <button class="chip" onclick="showAll()">${t.all(allActivities.length)}</button>
        </div>`;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function addUserMessage(text) {
    const box = document.getElementById("chat-box");
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function filterByClass(cls) {
    const t = UI_TEXT[currentLang];
    addUserMessage(currentLang === "kn" ? `${cls}ನೇ ತರಗತಿಯ ಪ್ರಯೋಗಗಳು` : `Grade ${cls} Experiments`);
    const results = allActivities.filter(a => a.Class && a.Class.includes(cls));
    renderActivities(results, t.classHeading(cls));
  }

  function showAll() {
    const t = UI_TEXT[currentLang];
    addUserMessage(currentLang === "kn" ? "ಎಲ್ಲಾ ಪ್ರಯೋಗಗಳನ್ನು ತೋರಿಸಿ" : "Show all experiments");
    renderActivities(allActivities, t.allHeading);
  }

  function handleSearch() {
    const t = UI_TEXT[currentLang];
    const input = document.getElementById("user-input");
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    addUserMessage(q);

    const classMatch = q.match(/\b(6|7|8)\b/) || q.match(/(6|7|8)ನೇ/);
    if (classMatch && q.length <= 15) {
      filterByClass(classMatch[1]);
      return;
    }

    const searchRes = fuse ? fuse.search(q).map(r => r.item) : [];
    if (searchRes.length > 0) {
      renderActivities(searchRes, t.foundHeading(q));
    } else {
      addBotMessage(t.notFound(q), true);
    }
  }

  function renderActivities(list, heading) {
    const t = UI_TEXT[currentLang];
    let html = `<div><b>${heading}</b></div>`;
    list.forEach(item => {
      const isNew = (item.Status || "").toLowerCase() === "new" ? `<span class="badge-new">${t.newBadge}</span>` : "";
      html += `
        <div class="act-card">
          <div class="act-title">${item.Activity} ${isNew}</div>
          <div class="act-meta">${t.classLabel}: ${item.Class} · ${t.subLabel}: ${item.Subject}</div>
          <div class="btn-row">
            <a class="open-btn" href="${item.Link}" target="_blank" onclick="trackOpen('${item.Activity}')">${t.openBtn}</a>
            <button class="fb-btn" onclick="openFeedbackModal('${item.Activity}')">${t.fbBtn}</button>
          </div>
        </div>`;
    });
    addBotMessage(html, false);
  }

  function trackOpen(activityName) {
    sendToGoogleForm("Viewed_Lab", activityName, "Opened Simulation");
  }

  function openFeedbackModal(activityName) {
    selectedActivity = activityName;
    document.getElementById("fb-act-title").textContent = activityName;
    document.getElementById("fb-modal").style.display = "flex";
  }

  function submitFeedback() {
    const rating = document.getElementById("fb-rating").value;
    const text = document.getElementById("fb-text").value.trim();
    sendToGoogleForm("Feedback", selectedActivity, `${rating} - ${text}`);
    document.getElementById("fb-text").value = "";
    closeModal("fb-modal");
    addBotMessage(currentLang === "kn"
      ? `🙏 ಧನ್ಯವಾದಗಳು! **${selectedActivity}** ಕುರಿತ ನಿಮ್ಮ ಅಭಿಪ್ರಾಯವನ್ನು ದಾಖಲಿಸಲಾಗಿದೆ.`
      : `🙏 Thank you! Your feedback for **${selectedActivity}** has been recorded.`);
  }

  function closeModal(id) {
    document.getElementById(id).style.display = "none";
  }

  function sendToGoogleForm(actionType, activityName, feedbackData) {
    const formData = new FormData();
    formData.append(ENTRY_IDS.action, actionType);
    formData.append(ENTRY_IDS.name, localStorage.getItem("u_name") || "Anonymous");
    formData.append(ENTRY_IDS.place, localStorage.getItem("u_place") || "Anonymous");
    formData.append(ENTRY_IDS.role, localStorage.getItem("u_role") || "Anonymous");
    formData.append(ENTRY_IDS.activity, activityName);
    formData.append(ENTRY_IDS.feedback, feedbackData);

    fetch(FORM_ACTION_URL, { method: "POST", mode: "no-cors", body: formData }).catch(() => {});
  }
</script>
</body>
</html>
